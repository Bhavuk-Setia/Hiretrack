<body>
<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div id="login-screen">

<!-- APP -->
<div id="app-screen" style="display:none">
<div class="app">
  <div class="sidebar">
    <div class="sb-top">
      <div class="sb-logo">HireTrack</div>
      <div class="sb-user" id="sb-name">—</div>

      <select class="asg-sel" id="asg-rec" onchange="updateAsgBar()">
        <option value="">— pick recruiter —</option>
        <option value="__rr__">Round-robin (auto)</option>
        <option value="__none__">⊘ Unassign selected leads</option>
      </select>
      <button class="btn pri" id="asg-btn" onclick="doAssign()" disabled>Confirm</button>

      <div class="loader-wrap"><div class="spinner"></div><div class="loader-text">Loading…</div></div>

<script>
// ════════════════════════════════════════════════════
// CONFIG — paste your Supabase project URL and anon key
// ════════════════════════════════════════════════════
const SB_URL = 'https://esgyriktdmlqnestbysl.supabase.co';       // e.g. https://xxxx.supabase.co
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzZ3lyaWt0ZG1scW5lc3RieXNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODAxODksImV4cCI6MjA5Mjk1NjE4OX0.BP8wrpjLhTNuUfmzWIiklaOVeV9Fzm97Xo2gW9vmrT8';  // long string from Settings → API

// ════════════════════════════════════════════════════
// SUPABASE API WRAPPER
// Direct REST calls — no SDK needed
// ════════════════════════════════════════════════════
const SB = {
  // ── SELECT rows with server-side filtering + pagination ──────────
  async select(table, { select='*', filters=[], order='', limit=100, offset=0 }={}) {
    let url = `${SB_URL}/rest/v1/${table}?select=${select}`;
    filters.forEach(f => { if(f) url += '&'+f; });
    if(order)  url += `&order=${order}`;
    url += `&limit=${limit}&offset=${offset}`;
    const r = await fetch(url, {
      headers: {
        'apikey':        SB_KEY,
        'Authorization': `Bearer ${SB_KEY}`,
        'Content-Type':  'application/json'
      }
    });
    const data = await r.json();
    return { data: Array.isArray(data)?data:[], ok: r.ok };
  },

  // ── COUNT rows — HEAD request, no rows fetched ───────────────────
  // Returns the true total from content-range header
  async count(table, filters=[]) {
    let url = `${SB_URL}/rest/v1/${table}?select=lead_id`;
    filters.forEach(f => { if(f) url += '&'+f; });
    try {
      const r = await fetch(url, {
        method: 'HEAD',
        headers: {
          'apikey':        SB_KEY,
          'Authorization': `Bearer ${SB_KEY}`,
          'Range-Unit':    'items',
          'Prefer':        'count=exact'
        }
      });
      const cr = r.headers.get('content-range')||'';
      return cr.includes('/') ? parseInt(cr.split('/')[1])||0 : 0;
    } catch(e) { return 0; }
  },

  // ── INSERT one or many rows ──────────────────────────────────────
  async insert(table, rows) {
    const r = await fetch(`${SB_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: {
        'apikey':        SB_KEY,
        'Authorization': `Bearer ${SB_KEY}`,
        'Content-Type':  'application/json',
        'Prefer':        'return=minimal'
      },
      body: JSON.stringify(Array.isArray(rows)?rows:[rows])
    });
    let body = null;
    try { body = await r.json(); } catch(e) {}
    if(!r.ok) console.error('SB.insert error:', table, r.status, body);
    return { ok: r.ok, status: r.status, body };
  },

  // ── UPDATE rows matching filters ─────────────────────────────────
  async update(table, data, filters=[]) {
    let url = `${SB_URL}/rest/v1/${table}?`;
    filters.forEach(f => { if(f) url += f+'&'; });
    const r = await fetch(url, {
      method: 'PATCH',
      headers: {
        'apikey':        SB_KEY,
        'Authorization': `Bearer ${SB_KEY}`,
        'Content-Type':  'application/json',
        'Prefer':        'return=minimal'
      },
      body: JSON.stringify(data)
    });
    return { ok: r.ok, status: r.status };
  }
};

// ════════════════════════════════════════════════════
// APP STATE
// ════════════════════════════════════════════════════
let SESSION          = null;
let LEADS            = [];
let RECRUITERS       = [];
let COUNTS           = {};
let appRole          = 'manager';
let page             = 'dashboard';
let prevPage         = 'dashboard';
let selLeads         = new Set();
let activeLead       = null;
let _activeRecruiter = null;  // recruiter being viewed in manager sidebar
let _savedF       = null;     // saved filter state before opening lead detail
let _savedOffset  = 0;        // saved pagination offset before opening lead detail

// Pagination state
const PAGE_SIZE = 100;    // rows per page — instant load from Supabase
let _pgOffset   = 0;
let _pgTotal    = 0;
let _pgFilters  = [];     // active Supabase filter strings
let _pgTitle    = '';
let _pgAssign   = false;

const STATUSES=['New','Rejected','Interested','Shortlisted',
  'Submitted to Client','Placed','Not Interested','Not Reachable','On Hold'];
const SC={New:'b-new',Rejected:'b-con',Interested:'b-int',Shortlisted:'b-sho',
  'Not Interested':'b-no','Not Reachable':'b-no','On Hold':'b-new',
  'Submitted to Client':'b-sho',Placed:'b-int'};
const MGR_ONLY = ['full_name','phone_primary','email'];
const REC_EDIT = ['current_city','current_company','standard_role','naukri_job_title',
  'current_designation','department','industry','experience_yrs',
  'current_ctc_lpa','shortlisted_for','process_type'];

// Filter UI state
let F = {
  q:'', roles:[], statuses:[], cities:[], industries:[],
  depts:[], sources:[], owners:[],
  call_outcomes:[], eng_levels:[], naukri_titles:[], process_types:[],
  genders:[], clients:[],
  current_role_q:'',
  ctc_op:'between', ctc_a:'', ctc_b:'',
  exp_op:'between', exp_a:'', exp_b:''
};

// ════════════════════════════════════════════════════
// LOGIN
// ════════════════════════════════════════════════════
document.getElementById('li-pass')
  .addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

async function doLogin() {
  const email = document.getElementById('li-email').value.trim();
  const pass  = document.getElementById('li-pass').value.trim();
  const btn   = document.getElementById('li-btn');
  const err   = document.getElementById('li-err');
  if(!email||!pass){ err.textContent='Please enter email and password.'; return; }
  btn.disabled=true; btn.textContent='Signing in…'; err.textContent='';

  const res = await SB.select('users', {
    filters: [
      `email=eq.${encodeURIComponent(email)}`,
      `password=eq.${encodeURIComponent(pass)}`
    ],
    limit: 1
  });

  if(res.ok && res.data.length > 0) {
    const u = res.data[0];
    SESSION  = { name: u.name, email: u.email, role: u.role };
    appRole  = u.role;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display   = 'block';
    // Only show role switcher to managers

// Real-time phone duplicate check — fires when user leaves the phone field
async function checkPhoneLive() {
  const hint  = document.getElementById('al-phone-hint');
  const input = document.getElementById('al-phone');
  const raw   = input.value.trim().replace(/\D/g, '');
  let phone   = raw;
  if (phone.startsWith('91') && phone.length === 12) phone = phone.slice(2);

  hint.style.display = 'none';
  hint.textContent   = '';
  input.style.borderColor = '';

  if (phone.length !== 10) return; // not a complete number yet

  hint.textContent = 'Checking…';
  hint.style.color = '#94a3b8';
  hint.style.display = 'block';

  const res = await SB.select('leads', { filters: [`phone_primary=eq.${phone}`], limit: 1 });
  if (res.data && res.data.length > 0) {
    const d = res.data[0];
    hint.textContent = `⚠ Already exists — ${d.full_name} (${d.lead_id})`;
    hint.style.color = '#e53e3e';
    input.style.borderColor = '#e53e3e';
  } else {
    hint.textContent = '✓ Phone is available';
    hint.style.color = '#38a169';
    input.style.borderColor = '#38a169';
  }
}

// ── EXCEL DOWNLOAD ───────────────────────────────────────────────
async function downloadLeads(mode) {
  const btn = document.getElementById('dl-btn');
  if(btn){ btn.textContent='⏳ Preparing…'; btn.disabled=true; }

  try {
    let rows = [];

    if(mode === 'filtered') {
      const filters = buildFilters();
      let offset = 0, done = false;
      while(!done) {
        const res = await SB.select('leads', {filters, order:'create_date.desc', limit:5000, offset});
        if(res.data && res.data.length) {
          rows = rows.concat(res.data);
          offset += 5000;
          if(res.data.length < 5000) done = true;
        } else { done = true; }
      }
    } else {
      let offset = 0, done = false;
      while(!done) {
        const r = await fetch(
          `${SB_URL}/rest/v1/leads?select=*&limit=5000&offset=${offset}`,
          {headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Range-Unit':'items'}}
        );
        const data = await r.json();
        if(data && data.length){ rows = rows.concat(data); offset+=5000; if(data.length<5000) done=true; }
        else done=true;
      }
    }

    if(!rows.length){ alert('No leads to download.'); return; }

    const cols = ['lead_id','full_name','phone_primary','email','gender','current_city','state',
      'current_company','current_designation','standard_role','naukri_job_title',
      'industry','department','process_type','experience_yrs','current_ctc_lpa',
      'source_channel','status','owner','last_call_outcome','last_call_notes',
      'english_proficiency','shortlisted_for','create_date','date_applied',
      'last_call_date','followup_date'];

    const wsData = [cols];
    rows.forEach(r => wsData.push(cols.map(c => r[c] ?? '')));

    const ws = XLSX.utils.aoa_to_sheet(wsData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Leads');

    const today = new Date().toISOString().slice(0,10);
    const filename = mode==='filtered'
      ? `HireTrack_Filtered_${today}.xlsx`
      : `HireTrack_AllLeads_${today}.xlsx`;

    XLSX.writeFile(wb, filename);
  } catch(e) {
    alert('Download failed: ' + e.message);
  } finally {
    if(btn){ btn.textContent='⬇ Download'; btn.disabled=false; }
  }
}

async function saveNewLead() {
  const btn = document.getElementById('al-save-btn');
  const err = document.getElementById('al-err');
  err.style.display = 'none';

  // Validate
  const name  = document.getElementById('al-name').value.trim();
  const rawPh = document.getElementById('al-phone').value.trim().replace(/\D/g,'');
  const phone = rawPh.startsWith('91') && rawPh.length===12 ? rawPh.slice(2) : rawPh;

  if(!name) {
    err.textContent='Full name is required.'; err.style.display='block'; return;
  }
  if(phone.length!==10 || !'6789'.includes(phone[0])) {
    err.textContent='Please enter a valid 10-digit mobile number.'; err.style.display='block'; return;
  }

  btn.disabled=true; btn.textContent='Checking…';

  // Check duplicate phone
  const dup = await SB.select('leads',{filters:[`phone_primary=eq.${phone}`],limit:1});
  if(dup.data && dup.data.length > 0) {
    err.textContent=`This phone already exists — ${dup.data[0].full_name} (${dup.data[0].lead_id})`;
    err.style.display='block'; btn.disabled=false; btn.textContent='Save Lead'; return;
  }

  // Get next lead ID — uses RPC with fallback, then retries on 409 (race condition proof)
  btn.textContent='Saving…';
  const today = new Date().toISOString().slice(0,10);

  async function getMaxId() {
    // Try RPC first
    try {
      const maxRes = await fetch(
        `${SB_URL}/rest/v1/rpc/get_max_lead_id`,
        {method:'POST',headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json'},body:'{}'}
      );
      if (maxRes.ok) { const v = await maxRes.json(); return v || 0; }
    } catch(e) {}
    // Fallback: scan all lead_ids numerically
    let maxId = 0, offset = 0;
    while (true) {
      const r = await fetch(`${SB_URL}/rest/v1/leads?select=lead_id&limit=5000&offset=${offset}`,
        {headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}});
      const rows = await r.json();
      if (!rows || !rows.length) break;
      rows.forEach(row => {
        if (row.lead_id) {
          const n = parseInt(String(row.lead_id).replace(/^L-0*/, '')) || 0;
          if (n > maxId) maxId = n;
        }
      });
      offset += 5000;
      if (rows.length < 5000) break;
    }
    return maxId;
  }

  let maxId = await getMaxId();
  let newId = `L-${String(maxId+1).padStart(5,'0')}`;

  const lead = {
    lead_id:             newId,
    full_name:           name.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' '),
    phone_primary:       phone,
    email:               document.getElementById('al-email').value.trim().toLowerCase()||'',
    gender:              document.getElementById('al-gender').value||'',
    current_city:        document.getElementById('al-city').value.trim()||'',
    state:               document.getElementById('al-state').value.trim()||'',
    current_company:     document.getElementById('al-company').value.trim()||'',
    current_designation: document.getElementById('al-designation').value.trim()||'',
    standard_role:       document.getElementById('al-role').value||'',
    industry:            document.getElementById('al-industry').value.trim()||'',
    department:          document.getElementById('al-dept').value.trim()||'',
    process_type:        document.getElementById('al-process').value||'',
    experience_yrs:      parseFloat(document.getElementById('al-exp').value)||null,
    current_ctc_lpa:     parseFloat(document.getElementById('al-ctc').value)||null,
    source_channel:      document.getElementById('al-source').value||'Other',
    shortlisted_for:     document.getElementById('al-shortlisted').value.trim()||'',
    date_applied:        document.getElementById('al-date').value||today,
    status:              'New',
    owner:               SESSION.name,
    create_date:         today,
  };

  // Retry up to 5 times on 409 conflict (race condition — another user got same ID)
  let res, attempts = 0;
  while (attempts < 5) {
    lead.lead_id = newId;
    res = await SB.insert('leads', [lead]);
    if (res.ok) break;
    if (res.status === 409) {
      attempts++;
      maxId = await getMaxId();
      newId = `L-${String(maxId+1).padStart(5,'0')}`;
    } else {
      break; // non-409 error — stop retrying
    }
  }

  if(res.ok) {
    toast('Lead added — '+lead.full_name+' ('+newId+') ✓');
    await loadCounts();
    navRender();
    LEADS=[lead]; activeLead=newId;
    prevPage=appRole==='recruiter'?'my-leads':'all';
    page='detail'; render();
  } else {
    err.textContent='Error saving: '+(res.body?(res.body.message||res.body.code||''):'unknown error');
    err.style.display='block'; btn.disabled=false; btn.textContent='Save Lead';
  }
}

async function loadCounts() {
  const base = [
    SB.count('leads'),
    SB.count('leads', ['or=(owner.eq.,owner.is.null)']),

  ];
  const recName = SESSION ? encodeURIComponent(SESSION.name) : '';
  const rec = appRole==='recruiter' ? [
    SB.count('leads', [`owner=eq.${recName}`]),
    SB.count('leads', [`owner=eq.${recName}`,
      `or=(last_call_outcome.eq.Connected,last_call_outcome.eq.Callback%20Requested)`]),
    SB.count('leads', [`owner=eq.${recName}`,`status=in.(Interested,Shortlisted)`]),
    SB.count('leads', [`owner=eq.${recName}`,`followup_date=not.is.null`]),
  ] : [Promise.resolve(0),Promise.resolve(0),Promise.resolve(0),Promise.resolve(0)];

  const [total, unassigned, pipeline, myLeads, myCalled, myPipeline, myFollowups]
    = await Promise.all([...base, ...rec]);
  COUNTS = { total, unassigned, pipeline, myLeads, myCalled, myPipeline, myFollowups };

// ════════════════════════════════════════════════════
// LOAD LEADS — server-side filtering, instant response
// ════════════════════════════════════════════════════
function buildFilters() {
  const filters = [];

  // Page-level filters
  if(page === 'assign')    filters.push('or=(owner.eq.,owner.is.null)');
  if(page === 'my-leads' || page === 'followups')
    filters.push(`owner=eq.${encodeURIComponent(SESSION.name)}`);
  if(page === 'rec-leads' && _activeRecruiter)
    filters.push(`owner=eq.${encodeURIComponent(_activeRecruiter)}`);
  if(page === 'followups') filters.push('followup_date=not.is.null');

  // UI filters
  if(F.q) {
    const qEnc = encodeURIComponent(F.q);
    // Search across name, phone, city, email and naukri title
    filters.push(`or=(full_name.ilike.*${qEnc}*,phone_primary.ilike.*${qEnc}*,current_city.ilike.*${qEnc}*,email.ilike.*${qEnc}*,naukri_job_title.ilike.*${qEnc}*)`);
  }
  // Helper: builds a safe filter for values with special chars (commas, &, /, spaces)
  function makeFilter(field, values) {
    if(!values.length) return null;

    // Special case: "Not Called" for last_call_outcome
    // Matches empty string, NULL, and literal "Not Called"
    const expandedValues = values.map(v => {
      if(v === 'Not Called' && field === 'last_call_outcome') return '__NOT_CALLED__';
      return v;
    });

    const parts = [];
    expandedValues.forEach((v, i) => {
      if(v === '__NOT_CALLED__') {
        // Add three conditions for "not called" state
        parts.push(`last_call_outcome.eq.`);
        parts.push(`last_call_outcome.is.null`);
        parts.push(`last_call_outcome.eq.Not Called`);
      } else {
        const escaped = values[i].replace(/"/g, '\\"');
        parts.push(`${field}.eq."${escaped}"`);
      }
    });

    if(parts.length === 1 && !values.includes('Not Called')) {
      return `${field}=eq.${encodeURIComponent(values[0])}`;
    }
    const inner = parts.join(',');
    return `or=${encodeURIComponent('(' + inner + ')')}`;
  }

  const roleF   = makeFilter('standard_role',        F.roles);
  const statusF = makeFilter('status',               F.statuses);
  const cityF   = makeFilter('current_city',         F.cities);
  const indF    = makeFilter('industry',             F.industries);
  const deptF   = makeFilter('department',           F.depts);
  const srcF    = makeFilter('source_channel',       F.sources);
  const coF      = makeFilter('last_call_outcome',    F.call_outcomes);
  const engF     = makeFilter('english_proficiency',  F.eng_levels);
  const naukriF  = makeFilter('naukri_job_title',     F.naukri_titles);

  if(roleF)    filters.push(roleF);
  if(statusF)  filters.push(statusF);
  if(cityF)    filters.push(cityF);
  if(indF)     filters.push(indF);
  if(deptF)    filters.push(deptF);
  if(srcF)     filters.push(srcF);
  if(coF)      filters.push(coF);
  if(engF)     filters.push(engF);
  if(naukriF)  filters.push(naukriF);
  const procF   = makeFilter('process_type', F.process_types);
  if(procF)    filters.push(procF);
  const genderF = makeFilter('gender', F.genders);
  if(genderF)  filters.push(genderF);
  const clientF = makeFilter('shortlisted_for', F.clients);
  if(clientF)  filters.push(clientF);
  if(F.current_role_q && F.current_role_q.trim())
    filters.push(`current_designation=ilike.*${encodeURIComponent(F.current_role_q.trim())}*`);
  if(F.owners.length) {
    if(F.owners.length === 1) {
      filters.push(F.owners[0]==='Unassigned'
        ? 'owner=eq.'
        : `owner=eq.${encodeURIComponent(F.owners[0])}`);
    } else {
      const ownerParts = F.owners.map(o =>
        o==='Unassigned' ? 'owner.eq.' : `owner.eq.${encodeURIComponent(o)}`
      );
      filters.push(`or=(${ownerParts.join(',')})`);
    }
  }

  // Numeric filters
  if(F.ctc_a!==''||F.ctc_b!=='') {
    if(F.ctc_op==='between'){
      if(F.ctc_a!=='') filters.push(`current_ctc_lpa=gte.${F.ctc_a}`);
      if(F.ctc_b!=='') filters.push(`current_ctc_lpa=lte.${F.ctc_b}`);
    } else {
      const op={'>':'gt','>=':'gte','<':'lt','<=':'lte','=':'eq'}[F.ctc_op]||'eq';
      if(F.ctc_a!=='') filters.push(`current_ctc_lpa=${op}.${F.ctc_a}`);
    }
  }
  if(F.exp_a!==''||F.exp_b!=='') {
    if(F.exp_op==='between'){
      if(F.exp_a!=='') filters.push(`experience_yrs=gte.${F.exp_a}`);
      if(F.exp_b!=='') filters.push(`experience_yrs=lte.${F.exp_b}`);
    } else {
      const op={'>':'gt','>=':'gte','<':'lt','<=':'lte','=':'eq'}[F.exp_op]||'eq';
      if(F.exp_a!=='') filters.push(`experience_yrs=${op}.${F.exp_a}`);
    }
  }

  return filters;
}

async function loadLeads(offset=0) {
  showLoader();
  const filters = buildFilters();

  // Fetch data and count in parallel
  const [res, total] = await Promise.all([
    SB.select('leads', {
      filters,
      order: 'create_date.desc',
      limit:  PAGE_SIZE,
      offset
    }),
    SB.count('leads', filters)
  ]);

  if(res.ok) {
    LEADS     = res.data;
    _pgTotal  = total;
    _pgOffset = offset;
    renderLeadsTable();
  } else {
    toast('Error loading leads — check console', true);
    console.error('Supabase error:', res);
    hideLoader();
  }
}

// For dropdowns that need dynamic options, we pre-load from DB once
let _msOpts = {roles:[],cities:[],industries:[],depts:[],sources:[],naukri_titles:[]};

async function loadFilterOptions() {
  const [roles, cities, inds, depts, sources, naukri] = await Promise.all([
    SB.select('leads', { select:'standard_role',    limit:50000 }),
    SB.select('leads', { select:'current_city',     limit:50000 }),
    SB.select('leads', { select:'industry',         limit:50000 }),
    SB.select('leads', { select:'department',       limit:50000 }),
    SB.select('leads', { select:'source_channel',   limit:50000 }),
    SB.select('leads', { select:'naukri_job_title', limit:50000 }),
  ]);
  const uniq = (res, key) =>
    [...new Set((res.data||[]).map(r => r[key]).filter(Boolean))].sort();
  _msOpts.roles         = uniq(roles,   'standard_role');
  _msOpts.cities        = uniq(cities,  'current_city');
  _msOpts.industries    = uniq(inds,    'industry');
  _msOpts.depts         = uniq(depts,   'department');
  _msOpts.sources       = ['Naukri','Naukri (Self)','Google Form','LinkedIn','WhatsApp','Referral','Other'];
  _msOpts.naukri_titles = uniq(naukri,  'naukri_job_title');
}

function msToggleDD(id){

  const filtered = q ? opts.filter(o=>o.toLowerCase().includes(q.toLowerCase())) : opts;

function toggleSel(id){
  if(selLeads.has(id))selLeads.delete(id);else selLeads.add(id);
  const c=document.getElementById('chk-'+id);if(c)c.checked=selLeads.has(id);
  const r=document.getElementById('row-'+id);if(r)r.classList.toggle('sel',selLeads.has(id));
  updateAsgBar();
}
function selAll(chk){
  document.querySelectorAll('.row-chk').forEach(c=>{
    const id=c.id.replace('chk-','');c.checked=chk.checked;
    if(chk.checked)selLeads.add(id);else selLeads.delete(id);
    const r=document.getElementById('row-'+id);if(r)r.classList.toggle('sel',chk.checked);
  });
  updateAsgBar();
}
function clearSel(){
  selLeads=new Set();
  document.querySelectorAll('.row-chk').forEach(c=>c.checked=false);
  const ca=document.getElementById('chk-all');if(ca)ca.checked=false;
  document.querySelectorAll('.tbl tr.sel').forEach(r=>r.classList.remove('sel'));
  updateAsgBar();
}
function updateAsgBar(){
  const n=selLeads.size;
  const bar=document.getElementById('asgbar');
  const btn=document.getElementById('asg-btn');
  const hint=document.getElementById('asg-hint');
  const rec=document.getElementById('asg-rec');
  const info=document.getElementById('asg-info');
  if(n>0){
    bar.classList.add('on');
    if(info)info.textContent=n+' lead'+(n>1?'s':'')+' selected';
    const rv=rec?rec.value:'';
    if(btn)btn.disabled=!rv;
    if(hint){
      if(rv==='__rr__')hint.textContent='Distribute across all recruiters';
      else if(rv==='__none__')hint.textContent='Send back to unassigned pool';
      else if(rv)hint.textContent='→ '+rv;
      else hint.textContent='';
    }
  } else {
    bar.classList.remove('on');
    if(btn)btn.disabled=true;
    if(hint)hint.textContent='';
  }
}

async function doAssign(){
  const rec=document.getElementById('asg-rec').value;if(!rec)return;
  const ids=[...selLeads];
  const btn=document.getElementById('asg-btn');
  btn.disabled=true;btn.textContent='Saving…';

  let updated=0;
  const BATCH=100; // Supabase handles 100 IDs in IN clause fine

  if(rec==='__none__'){
    // Bulk unassign — set owner to empty string
    for(let i=0;i<ids.length;i+=BATCH){
      const batch=ids.slice(i,i+BATCH);
      const r=await SB.update('leads',{owner:''},
        [`lead_id=in.(${batch.join(',')})`]);
      updated+=batch.length;
      btn.textContent=`Saving… ${updated}/${ids.length}`;
    }
  } else if(rec==='__rr__'){
    // Round-robin across recruiters
    for(let i=0;i<ids.length;i+=BATCH){
      const batch=ids.slice(i,i+BATCH);
      // Assign each in batch to recruiter based on index
      const updates=batch.map((id,j)=>
        SB.update('leads',{owner:RECRUITERS[(i+j)%RECRUITERS.length]},
          [`lead_id=eq.${id}`])
      );
      await Promise.all(updates);
      updated+=batch.length;
      btn.textContent=`Saving… ${updated}/${ids.length}`;
    }
  } else {
    // Assign all to one recruiter in batches
    for(let i=0;i<ids.length;i+=BATCH){
      const batch=ids.slice(i,i+BATCH);
      await SB.update('leads',{owner:rec},
        [`lead_id=in.(${batch.join(',')})`]);
      updated+=batch.length;
      btn.textContent=`Saving… ${updated}/${ids.length}`;
    }
  }

  const action = rec==='__none__'?'unassigned':'assigned';
  toast(updated+' lead'+(updated>1?'s':'')+' '+action+' ✓');
  clearSel();
  btn.disabled=false;btn.textContent='Confirm';
  document.getElementById('asg-rec').value='';
  await loadCounts();
  navRender();
  await loadLeads(_pgOffset);
}

async function loadDashboardDetails(){
  const allStatuses = ['New','Rejected','Interested','Shortlisted',
    'Submitted to Client','Not Interested','Not Reachable','On Hold'];

  // Fetch all counts in parallel — each is a fast HEAD COUNT query
  const [statusCounts, unassignedRes, recCounts] = await Promise.all([
    // Count per status
    Promise.all(allStatuses.map(async s => ({
      status: s,
      count:  await SB.count('leads', [`status=eq.${encodeURIComponent(s)}`])
    }))),
    // Recent unassigned leads
    SB.select('leads',{
      filters:['or=(owner.eq.,owner.is.null)'],
      order:'create_date.desc',
      limit:6
    }),
    // Count per recruiter
    Promise.all(RECRUITERS.map(async r => ({
      name:  r,
      total: await SB.count('leads',[`owner=eq.${encodeURIComponent(r)}`]),
      called: await SB.count('leads',[`owner=eq.${encodeURIComponent(r)}`,`status=not.eq.New`]),
      interested: await SB.count('leads',[`owner=eq.${encodeURIComponent(r)}`,`status=in.(Interested,Shortlisted)`]),
    })))
  ]);

  const scMap = {};
  statusCounts.forEach(({status,count}) => scMap[status] = count);
  const total = COUNTS.total || 1;

  const el=document.getElementById('dash-details');if(!el)return;
  el.innerHTML=`
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
  <div class="card"><div class="ch"><div class="ch-t">Pipeline by status</div></div><div style="padding:14px">
    ${['New','Rejected','Interested','Shortlisted','Submitted to Client','Not Interested','Not Reachable'].map(s=>{
      const n=scMap[s]||0;
      const pct=total>0?Math.round(n/total*100):0;
      const colours={'Interested':'#22c55e','Shortlisted':'#f59e0b',
        'Not Interested':'#ef4444','Not Reachable':'#ef4444',
        'Submitted to Client':'#8b5cf6'};
      const bar=colours[s]||'#4361ee';
      return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-size:12px;width:140px;color:#888;white-space:nowrap">${s}</span>
        <div style="flex:1;height:6px;background:#f0f1f5;border-radius:3px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${bar};border-radius:3px"></div></div>
        <span style="font-size:11px;font-family:monospace;width:40px;text-align:right">${n.toLocaleString()}</span>
      </div>`;}).join('')}
  </div></div>

async function renderPerformance(){
  document.getElementById('pg-title').textContent='Performance';
  document.getElementById('tba').innerHTML=`<button class="btn" onclick="renderPerformance()">↻ Refresh</button>`;
  document.getElementById('asgbar').classList.remove('on');
  document.getElementById('content').innerHTML=
    `<div class="loader-wrap"><div class="spinner"></div></div>`;

  // For recruiter: show only their own stats
  // For manager: show all recruiters
  const targetRecruiters = appRole==='recruiter' ? [SESSION.name] : RECRUITERS;
  const allStatuses = ['New','Rejected','Interested','Shortlisted',
    'Submitted to Client','Not Interested','Not Reachable','On Hold','Placed'];
  const callOutcomes = ['Not Called','Connected','Not Reachable',
    "Didn't Respond",'Callback Requested','Wrong Number'];

  const rows = await Promise.all(targetRecruiters.map(async r => {
    const [statusCounts, callCounts, total] = await Promise.all([
      Promise.all(allStatuses.map(s =>
        SB.count('leads',[`owner=eq.${encodeURIComponent(r)}`,`status=eq.${encodeURIComponent(s)}`])
      )),
      Promise.all(callOutcomes.map(o => {
        if(o === 'Not Called') {
          // Count leads where last_call_outcome is:
          // - NULL (never set)
          // - empty string (imported, never called)
          // - literal 'Not Called' (explicitly set)
          return SB.count('leads',[
            `owner=eq.${encodeURIComponent(r)}`,
            `or=(last_call_outcome.eq.,last_call_outcome.is.null,last_call_outcome.eq.Not Called)`
          ]);
        }
        return SB.count('leads',[
          `owner=eq.${encodeURIComponent(r)}`,
          `last_call_outcome=eq.${encodeURIComponent(o)}`
        ]);
      })),
      SB.count('leads',[`owner=eq.${encodeURIComponent(r)}`])
    ]);
    return { r, total, statusCounts, callCounts };
  }));

  const statusLabel = s => {
    const colours={New:'b-new',Rejected:'b-con',Interested:'b-int',
      Shortlisted:'b-sho','Not Interested':'b-no','Not Reachable':'b-no',
      'Submitted to Client':'b-sho',Placed:'b-int'};
    return `<span class="badge ${colours[s]||'b-new'}">${s}</span>`;
  };

  document.getElementById('content').innerHTML=`
  ${rows.map(({r,total,statusCounts,callCounts})=>`
  <div class="card" style="margin-bottom:14px">
    <div class="ch">
      <div class="ch-t">${r}</div>
      <span style="font-size:12px;color:#888">${total.toLocaleString()} leads assigned</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0">

      <div style="padding:14px;border-right:1px solid #f0f1f5">
        <div style="font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">By status</div>
        ${allStatuses.map((s,i)=>{
          const n=statusCounts[i]||0;if(!n&&s==='Placed')return'';
          const pct=total>0?Math.round(n/total*100):0;
          const bar={New:'#4361ee',Rejected:'#3b82f6',Interested:'#22c55e',
            Shortlisted:'#f59e0b','Submitted to Client':'#8b5cf6',
            'Not Interested':'#ef4444','On Hold':'#94a3b8',Placed:'#10b981'}[s]||'#4361ee';
          return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
            <span style="font-size:11px;width:130px;color:#888">${s}</span>
            <div style="flex:1;height:5px;background:#f0f1f5;border-radius:3px;overflow:hidden">
              <div style="height:100%;width:${pct}%;background:${bar};border-radius:3px"></div></div>
            <span style="font-size:11px;font-family:monospace;width:36px;text-align:right">${n.toLocaleString()}</span>
          </div>`;}).join('')}
      </div>

      <div style="padding:14px">
        <div style="font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">By call outcome</div>
        ${callOutcomes.map((o,i)=>{
          const n=callCounts[i]||0;
          const pct=total>0?Math.round(n/total*100):0;
          const bar={Connected:'#22c55e','Not Reachable':'#ef4444',
            "Didn't Respond":'#f87171','Callback Requested':'#f59e0b',
            'Wrong Number':'#94a3b8','Not Called':'#e2e8f0'}[o]||'#4361ee';
          return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
            <span style="font-size:11px;width:130px;color:#888">${o}</span>
            <div style="flex:1;height:5px;background:#f0f1f5;border-radius:3px;overflow:hidden">
              <div style="height:100%;width:${pct}%;background:${bar};border-radius:3px"></div></div>
            <span style="font-size:11px;font-family:monospace;width:36px;text-align:right">${n.toLocaleString()}</span>
          </div>`;}).join('')}
      </div>
    </div>
  </div>`).join('')}`;
}

function canEdit(k){if(appRole==='manager')return true;return REC_EDIT.includes(k);}

function fcell(k,lbl,l){
  const v=(l[k]!==undefined&&l[k]!==null&&l[k]!=='')?String(l[k]):'';
  const editable=canEdit(k);
  const locked=MGR_ONLY.includes(k)&&appRole==='recruiter';
  const ctrl=editable
    ?`<button class="fc-eb" onclick="startEdit('${k}','${l.lead_id}')">edit</button>`
    :locked?`<span class="fc-lock">manager only</span>`:'';
  return`<div class="fcell" id="fc-${k}">
    <div class="fclbl"><span class="fc-lt">${lbl}</span>${ctrl}</div>
    <div class="fcval${v?'':' empty'}" id="fv-${k}">${v||'—'}</div>
  </div>`;
}

function startEdit(k,lid){
  if(!canEdit(k))return;
  const l=LEADS.find(x=>x.lead_id===lid);if(!l)return;
  const v=l[k]!==undefined&&l[k]!==null?l[k]:'';
  const fv=document.getElementById('fv-'+k);if(!fv)return;
  const inp=k==='standard_role'
    ?`<select class="edit-inp" id="ei-${k}">${(_msOpts.roles||[]).map(o=>`<option${String(v)===o?' selected':''}>${o}</option>`).join('')}</select>`
    :`<input type="${k==='experience_yrs'||k==='current_ctc_lpa'?'number':'text'}"
       class="edit-inp" id="ei-${k}" value="${v}">`;
  fv.innerHTML=inp+`<div class="edit-acts">
    <button class="btn pri" style="font-size:11px;padding:3px 10px"
      onclick="saveEdit('${k}','${lid}')">Save</button>
    <button class="btn" style="font-size:11px;padding:3px 10px"
      onclick="cancelEdit('${k}','${lid}')">Cancel</button>
  </div>`;
  const el=document.getElementById('ei-'+k);
  if(el){el.focus();if(el.type!=='select-one'&&el.select)el.select();}
}

async function saveEdit(k,lid){
  const l=LEADS.find(x=>x.lead_id===lid);if(!l)return;
  const el=document.getElementById('ei-'+k);if(!el)return;
  const val=el.type==='number'?parseFloat(el.value)||null:el.value;
  const fv=document.getElementById('fv-'+k);
  if(fv)fv.innerHTML='<span style="color:#94a3b8;font-size:12px">Saving…</span>';
  const res=await SB.update('leads',{[k]:val},[`lead_id=eq.${lid}`]);
  if(res.ok){
    l[k]=val; toast('Updated ✓');
    renderDetail();
  } else {
    toast('Error saving field',true); cancelEdit(k,lid);
  }
}

function cancelEdit(k,lid){
  const l=LEADS.find(x=>x.lead_id===lid);if(!l)return;
  const fv=document.getElementById('fv-'+k);if(!fv)return;
  const v=(l[k]!==undefined&&l[k]!==null&&l[k]!=='')?String(l[k]):'';
  fv.className='fcval'+(v?'':' empty');fv.innerHTML=v||'—';
}

async function saveCall(lid){
  const l=LEADS.find(x=>x.lead_id===lid);if(!l)return;
  const btn=document.getElementById('call-save-btn');
  if(btn){btn.disabled=true;btn.textContent='Saving…';}

  const callOutcome   = document.getElementById('fo-out').value;
  const newStatus     = document.getElementById('fo-st').value;
  const englishProf   = document.getElementById('fo-eng').value;
  const notes         = document.getElementById('fo-notes').value;
  const rawDate = document.getElementById('fo-date').value;
  const followupDate = rawDate && rawDate.trim() ? rawDate.trim() : null;
  const shortlisted   = document.getElementById('fo-client').value;
  const today         = new Date().toISOString().slice(0,10);

  // 1. Insert into call_log
  // Try with status_after_call first (requires SQL migration to have been run)
  // Falls back gracefully if column doesn't exist yet
  const logId = 'LOG-'+Date.now();
  let logRes = await SB.insert('call_log',{
    log_id:             logId,
    lead_id:            lid,
    recruiter_name:     SESSION.name,
    call_date:          today,
    call_outcome:       callOutcome,
    status_after_call:  newStatus,
    english_proficiency:englishProf,
    notes:              notes,
    followup_date:      followupDate
  });

  // If insert failed (e.g. status_after_call column not yet added), retry without it
  if(!logRes.ok) {
    logRes = await SB.insert('call_log',{
      log_id:             logId+'_r',
      lead_id:            lid,
      recruiter_name:     SESSION.name,
      call_date:          today,
      call_outcome:       callOutcome,
      english_proficiency:englishProf,
      notes:              notes,
      followup_date:      followupDate
    });
  }

  // 2. Update lead — status, shortlisted_for, followup_date
  //    AND store last call outcome + date directly on lead
  //    so it shows in the table without opening call history
  await SB.update('leads',{
    status:              newStatus,
    shortlisted_for:     shortlisted,
    followup_date:       followupDate,
    last_call_outcome:   callOutcome,
    last_call_date:      today,
    last_call_notes:     notes,
    english_proficiency: englishProf
  },[`lead_id=eq.${lid}`]);

  // 3. Update local state so UI reflects immediately without re-fetch
  l.status             = newStatus;
  l.shortlisted_for    = shortlisted;
  l.followup_date      = followupDate;
  l.last_call_outcome  = callOutcome;
  l.last_call_date     = today;
  l.last_call_notes    = notes;
  l.english_proficiency= englishProf;

  // Check if log insert succeeded
  if(!logRes.ok) {
    console.error('Call log insert failed:', logRes.status, logRes.body);
    toast('Error saving call log (status: '+logRes.status+')', true);
    if(btn){btn.disabled=false;btn.textContent='Save call log';}
    return;
  }

  toast('Call logged ✓');
  if(btn){btn.disabled=false;btn.textContent='Save call log';}
  renderDetail();
}

}

          +(it.badge!==undefined?`<span class="nbadge ${it.bc||''}">${it.badge}</span>`:'');
        d.onclick=()=>nav(it.id);
        nb.appendChild(d);
      });
    });
  }
}

function setRole(r){
  // Recruiters cannot switch to manager view
  if(SESSION && SESSION.role === 'recruiter') r = 'recruiter';
  appRole=r;prevPage='dashboard';
  page=r==='manager'?'dashboard':'my-leads';
  document.getElementById('sw-m').classList.toggle('on',r==='manager');
  document.getElementById('sw-r').classList.toggle('on',r==='recruiter');
  document.getElementById('sb-badge').textContent=r==='manager'?'Manager':'Recruiter';
  document.getElementById('sb-badge').className='sb-badge '+(r==='manager'?'bm':'br');
  render();
}

function render(){
  // Always enforce role from session — prevents role drift
  if(SESSION) appRole = SESSION.role;
  // Enforce switcher visibility on every render
  const swWrap = document.getElementById('sw-wrap');
  if(swWrap) swWrap.style.display = SESSION && SESSION.role === 'manager' ? 'flex' : 'none';
  // Don't reset _activeRecruiter — it persists across renders for rec-view
  document.getElementById('sb-name').textContent=SESSION?.name||'—';
  document.getElementById('sb-badge').textContent=appRole==='manager'?'Manager':'Recruiter';
  document.getElementById('sb-badge').className='sb-badge '+(appRole==='manager'?'bm':'br');
  document.getElementById('asgbar').classList.remove('on');
  selLeads=new Set();
  navRender();
  // Only reset filters when navigating to a new page (not when restoring from detail)
  if(page !== prevPage || page === 'dashboard' || page === 'rec-dashboard') {
    F={q:'',roles:[],statuses:[],cities:[],industries:[],depts:[],sources:[],owners:[],
       call_outcomes:[],eng_levels:[],naukri_titles:[],process_types:[],
  genders:[],clients:[],
       ctc_op:'between',ctc_a:'',ctc_b:'',exp_op:'between',exp_a:'',exp_b:''};
  }

  if(page==='dashboard')        renderDashboard();
  else if(page==='all')         renderLeadsPage('All leads',true);
  else if(page==='assign')      renderLeadsPage('Assign leads',true);
  else if(page==='performance') renderPerformance();
  else if(page==='my-leads')    renderLeadsPage('My leads');
  else if(page==='followups')   renderLeadsPage('Follow-ups today');
  else if(page==='detail')      renderDetail();
  else if(page==='rec-view')    viewRecruiterDashboard(_activeRecruiter||'');
  else if(page==='rec-leads')   renderRecruiterLeads(_activeRecruiter||'');
  else if(page==='rec-dashboard') renderRecruiterDashboard();
  else if(page==='add-lead')      renderAddLead();
}
